
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私のポートフォリオ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <h1>私のポートフォリオ</h1>

            <a href="home.html">ホーム</a>
            <a href="form.html">お問い合わせ</a>

            <p>これまでに作成した作品の一部を紹介します。</p>
