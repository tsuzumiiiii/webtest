
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>西村鼓美のプロフィール</title>

  <style>
    /* ページ全体の設定 */
    body {
      background-color: #FFF0E8;
      font-family: "Hiragino Kaku Gothic ProN",
                   "Noto Sans JP", sans-serif;
      color: #743C46;
      text-align: center;
      padding: 40px 20px;
    }

    /* プロフィールカード */
    .profile {
      background-color: #F8D8D2;
      max-width: 400px;
      margin: 0 auto;
      padding: 35px;
      border-radius: 25px;
      box-shadow: 0 5px 15px #D9A9A080;
    }

    /* タイトル */
    h1 {
      color: #A94D58;
      font-size: 32px;
      letter-spacing: 3px;
    }

    /* 名前 */
    .name {
      color: #743C46;
      font-size: 28px;
      font-weight: bold;
    }

    /* ふりがな */
    .kana {
      color: #925C64;
      font-size: 14px;
    }

    /* プロフィール情報 */
    .info {
      background-color: #FFFFFF;
      padding: 20px;
      margin-top: 25px;
      border-radius: 15px;
      font-size: 17px;
      line-height: 2.5;
    }

    /* 桃のイラスト */
    .peach {
      font-size: 65px;
    }

    /* メッセージ */
    .message {
      color: #A94D58;
      font-size: 16px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="profile">
    <h1>My Profile</h1>

    <div class="peach">🍑</div>

    <p class="name">西村 鼓美</p>
    <p class="kana">にしむら つづみ</p>

    <div class="info">
      🎂 誕生日：1996年3月10日<br>
      🩸 血液型：B型<br>
      🍑 好きな食べ物：桃
    </div>

    <p class="message">
      Nice to meet you!
    </p>
  </div>

</body>
</html>
